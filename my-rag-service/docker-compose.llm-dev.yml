version: '3.8'

networks:
  llm-network:
    name: llm-network
    driver: bridge

volumes:
  es_data:
  qdrant_data:
  ollama_models:
  redis_data:

services:
  # 1. 중앙 로깅: Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: my-rag-service-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - llm-network

  # 2. 중앙 로깅: Fluent Bit
  fluent-bit:
    image: fluent/fluent-bit:3.0.4
    container_name: my-rag-service-fluent-bit
    ports:
      - "24224:24224"
    volumes:
      - ./logging/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    depends_on:
      - elasticsearch
    networks:
      - llm-network

  # 3. 중앙 로깅 대시보드: Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: my-rag-service-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - llm-network

  # 4. 고성능 Vector DB: Qdrant
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: my-rag-service-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - llm-network

  # 5. 캐싱 & Rate Limiter: Redis
  redis:
    image: redis:7.2-alpine
    container_name: my-rag-service-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - llm-network

  # 6. 로컬 LLM 서버: Ollama
  ollama:
    image: ollama/ollama:latest
    container_name: my-rag-service-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - llm-network
