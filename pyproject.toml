[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-dev-cli"
version = "0.1.0"
description = "LLM Project Scaffolder, Doctor & Lifecycle Compliance CLI"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "DevDooly", email = "sunhongyi@gmail.com" }
]
dependencies = [
    "rich>=13.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.3",
    "pydantic>=2.6.0"
]

[project.scripts]
llm-dev = "llm_dev.main:main"
