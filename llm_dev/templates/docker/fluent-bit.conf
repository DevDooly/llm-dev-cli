[SERVICE]
    Flush         1
    Log_Level     info

[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224

[OUTPUT]
    Name          es
    Match         *
    Host          elasticsearch
    Port          9200
    Index         llm-app-logs-%Y.%m.%d
    Type          _doc
    Suppress_Type_Name On
